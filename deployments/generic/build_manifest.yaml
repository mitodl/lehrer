---
# yaml-language-server: $schema=../../build_manifest.schema.json
version: 1
defaults:
  settings_namespace: production
  platform_repo: https://github.com/openedx/edx-platform
  translations_repo: https://github.com/openedx/openedx-translations
  translations_branch: main
  node_version: '24'
release_python:
  master: '3.12'
# The committed settings/*/models/aqueduct.py was generated from this one
# cell -- from its edx-platform source *and* from its installed plugin set,
# since codegen is passed --openedx-plugins <svc>.djangoapp. A cell in the same
# release with a different plugin set renders a different field set, so only
# this cell can be drift-checked; the others are still booted and
# system-checked against the committed model.
settings_model_release: master
settings_model_deployment: generic
cells:
- release: master
  deployment: generic
  platform_branch: master
  packages:
  # The LMS and CMS Deployments run Granian rather than the Gunicorn upstream
  # ships, so that Granian's static handler serves /static (see
  # local-dev/manifests/platform/deployment-lms.yaml). Nothing in
  # edx-platform installs it, and local-dev defaults to this cell.
  - granian==2.8.3
  - django-aqueduct==0.15.0
  - pydantic-settings[yaml]==2.15.0
  - opentelemetry-distro
  - opentelemetry-exporter-otlp-proto-http
  - opentelemetry-instrumentation-django
  - opentelemetry-instrumentation-celery
  - opentelemetry-instrumentation-mysqlclient
  overrides: []

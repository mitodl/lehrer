---
# Provisions a freshly-migrated edxapp database with the objects the stack
# needs in order to be usable: a superuser to log in as, the notes and Studio
# SSO OAuth clients, and the waffle flags for the enabled features. What it
# creates is declared in local-dev/provision/bootstrap.yaml (its users,
# oauth_applications and waffle_flags steps); the runner is lehrer_bootstrap,
# baked into the platform image from src/lehrer/bootstrap.
#
# Runs after edxapp-migrate (see lehrer-core.star) and before the LMS/CMS
# deployments are considered ready. Everything it does is idempotent, so Tilt
# re-running it on every platform image change is cheap.
apiVersion: batch/v1
kind: Job
metadata:
  name: edxapp-provision
  namespace: openedx
spec:
  backoffLimit: 3
  template:
    metadata:
      annotations:
        # Stamped by lehrer-core.star with a hash of bootstrap.yaml. A Job's
        # pod template is immutable, so a spec edit changes the Job and Tilt
        # replaces it, which is what re-runs it. Without this, editing the spec
        # only updates the ConfigMap of a Job that has already finished.
        lehrer.mit.edu/bootstrap-spec-checksum: "__BOOTSTRAP_SPEC_CHECKSUM__"
      labels:
        app: edxapp-provision
    spec:
      restartPolicy: Never
      containers:
      - name: provision
        # Image tag is managed by Tilt via custom_build (same ref as the
        # platform deployments).
        image: openedx-platform
        command:
        - python
        - -m
        - lehrer_bootstrap
        - /openedx/bootstrap/bootstrap.yaml
        - --steps
        - users,oauth_applications,waffle_flags
        env:
        # The runner calls django.setup() directly rather than going through
        # manage.py, so the settings module has to come from the environment.
        - name: DJANGO_SETTINGS_MODULE
          value: "lms.envs.aqueduct"
        envFrom:
        - configMapRef:
            name: lms-config
        - secretRef:
            name: openedx-secrets
        # Last wins: a caller composing this stack into its own cluster
        # supplies only the keys it needs to change (shared Valkey/
        # OpenSearch hosts, public URLs) instead of copying the whole
        # ConfigMap above and drifting from it.
        - configMapRef:
            name: lms-config-overrides
            optional: true
        volumeMounts:
        - name: bootstrap
          mountPath: /openedx/bootstrap
        resources:
          requests:
            memory: "1Gi"
            cpu: "250m"
          limits:
            memory: "2Gi"
      volumes:
      - name: bootstrap
        configMap:
          name: edxapp-bootstrap

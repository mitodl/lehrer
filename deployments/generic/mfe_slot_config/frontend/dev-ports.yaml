---
# Host port each Site Project's hot-reload dev server binds, keyed by the site
# directory name. Read by lehrer-core.star when `--mfe-hot-reload` is set.
#
# Declared here rather than derived from each site's site.config.dev.tsx
# baseUrl, because the two answer different questions: this is where
# webpack-dev-server listens on your machine, while baseUrl is where the
# browser reaches the app. They coincide only when a site gets a host to
# itself. An MFE served as a sub-path of the LMS — the topology
# ol-infrastructure deploys — has a baseUrl with the *LMS* origin and no port
# of its own, and would have nothing to derive from.
#
# When a site's baseUrl does carry an explicit port, lehrer-core.star checks
# the two agree: with a host to itself, a dev server listening anywhere other
# than where the app points is just a broken site.
#
# Ports must stay clear of the ones k3d's loadbalancer binds (see
# k3d-config.yaml), which it holds for as long as the cluster is up.
default: 8100

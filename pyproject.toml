[project]
name = "lehrer"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["cyclopts>=3", "dagger-io", "pydantic>=2.10", "pyyaml"]
license = "BSD-3-Clause"

[project.scripts]
lehrer = "lehrer.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "mypy==2.3.0",
  "pre-commit>=4.5.1",
  "pydantic-settings[yaml]",
  "pytest>=8",
  "ruff==0.16.3",
  "types-PyYAML",
  "types-requests",
]

[tool.mypy]
# Lets mypy resolve lehrer.* imports from disk (e.g. `from lehrer.cli import
# local_dev`) even when a single unrelated file is passed as the only CLI
# argument — the case for a normal incremental commit under the pre-commit
# hook's isolated environment, which doesn't have lehrer itself installed.
mypy_path = "src"
exclude = [
  # All files under deployments/ (OL-specific config) import Django, pydantic,
  # django_aqueduct, and openedx.* which only exist inside the edx-platform
  # container at runtime, not in lehrer's own venv.
  "deployments/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Ruff 0.16 expanded its implicit default from 59 rules to 413. Pinning the
# pre-0.16 default set keeps the lint surface a deliberate choice rather than
# something that moves under us on the next bump — deployments/ is mostly
# generated (settings/*/models/aqueduct.py) or Django-shaped config, and the
# expanded set flags ~670 findings there that say nothing about this repo.
# Widening this list is a separate decision, taken a rule family at a time.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
# Ruff 0.16 formats Python inside Markdown fences by default. The fenced blocks
# in README.md / docs/ are illustrative shell-and-Python snippets, not code we
# want normalised; leave them alone.
exclude = ["*.md"]

[tool.ruff.lint.per-file-ignores]
# deployments/mit-ol/settings/ contains three kinds of files that deliberately
# break ruff defaults:
#
#   assets.py / i18n.py        — use `from ..common import *` (F403) and reference
#                                names imported by that star import (F405/F401).
#
#   process_scheduled_emails.py / saml_pull.py
#                              — setup() must be called before Django imports;
#                                E402 (module-level import not at top) is intentional.
"deployments/mit-ol/settings/**" = ["E402", "F401", "F403", "F405"]
"deployments/generic/settings/**" = ["E402", "F401", "F403", "F405"]

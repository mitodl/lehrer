---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes
  namespace: openedx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notes
  template:
    metadata:
      labels:
        app: notes
    spec:
      containers:
      - name: notes
        image: lehrer-registry:5000/openedx-notes:dev
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: notes-config
        - secretRef:
            name: openedx-secrets
        env:
        # env_config.py reads the OAuth pair under unprefixed names; the
        # Secret stores them under NOTES_*.
        - name: OAUTH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: openedx-secrets
              key: NOTES_OAUTH_CLIENT_ID
        - name: OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: openedx-secrets
              key: NOTES_OAUTH_CLIENT_SECRET
        readinessProbe:
          httpGet:
            path: /heartbeat/
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 10
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"

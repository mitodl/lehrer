---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cms-config
  namespace: openedx
data:
  MYSQL_HOST: "mysql.openedx.svc.cluster.local"
  MYSQL_PORT: "3306"
  MYSQL_DB_NAME: "edxapp"
  MYSQL_USER: "edxapp"

  CELERY_BROKER_TRANSPORT: "redis"
  CELERY_BROKER_HOSTNAME: "redis-valkey.openedx.svc.cluster.local"
  # Django caches (and the cache-backed sessions) on the broker's Valkey. The
  # host follows CELERY_BROKER_HOSTNAME, so a caller that repoints the broker
  # moves the caches too. Without it every cache alias points at a memcached
  # nobody runs and no login can hold a session.
  #
  # DB 3, not 1: this default is inherited by callers that repoint the broker
  # at a Valkey they share with other applications (ol-infrastructure's
  # local-dev, where DB 0-2 are already mit-learn's cache and the Celery
  # broker of mitxonline, learn-ai and odl-video-service). Django's RedisCache
  # clear() is a FLUSHDB, so landing on an occupied DB means an LMS or Studio
  # cache clear drops someone else's data. DB 0 is this broker's own.
  CACHE_REDIS_DB: "3"
  CELERY_BROKER_USER: ""
  CELERY_BROKER_PASSWORD: ""
  CELERY_BROKER_VHOST: ""

  MONGODB_HOST: "mongodb-svc.openedx.svc.cluster.local"
  MONGODB_PORT: "27017"
  MONGODB_USER: "edxapp"
  MONGODB_DB: "edxapp"
  MONGODB_REPLICASET: "mongodb"
  MONGODB_AUTH_SOURCE: "admin"

  # Typesense (local-dev/manifests/search/typesense.yaml) as edx-search's
  # engine. The CMS indexes courseware through it on publish only once
  # ENABLE_COURSEWARE_INDEX is on, which local dev leaves at its default
  # (off). TYPESENSE_API_KEY comes from openedx-secrets.
  SEARCH_ENGINE: "search.typesense.TypesenseEngine"
  TYPESENSE_URLS: '["http://typesense.openedx.svc.cluster.local:8108"]'
  TYPESENSE_COLLECTION_PREFIX: "openedx_"

  # Studio content search (Libraries V2) on Meilisearch
  # (local-dev/manifests/search/meilisearch.yaml). MEILISEARCH_API_KEY comes
  # from openedx-secrets; the meilisearch-key Job creates it. The CMS migrate
  # creates and configures the indexes in a post_migrate hook, and runs under
  # edxapp-migrate with lms-config's environment, so job-migrate.yaml maps
  # ENABLED and URL from here rather than restating them.
  MEILISEARCH_ENABLED: "true"
  MEILISEARCH_URL: "http://meilisearch.openedx.svc.cluster.local:7700"
  # The browser queries Meilisearch directly with a tenant token Studio signs.
  # lehrer-core.star port-forwards 7700 when Traefik is the ingress; a caller
  # with its own ingress overrides this.
  MEILISEARCH_PUBLIC_URL: "http://localhost:7700"

  LMS_BASE_URL: "http://localhost:8000"
  CMS_BASE_URL: "http://localhost:8010"
  LMS_BASE: "localhost:8000"
  CMS_BASE: "localhost:8010"

  # Studio login goes through the LMS's OAuth2 provider. The browser is sent to
  # authorize at LMS_BASE_URL (SOCIAL_AUTH_EDX_OAUTH2_PUBLIC_URL_ROOT defaults
  # to it), but the token exchange runs from this pod, which cannot reach the
  # LMS through the host's localhost. The key and secret come from
  # openedx-secrets and match the cms-sso application edxapp-provision creates.
  SOCIAL_AUTH_EDX_OAUTH2_URL_ROOT: "http://lms.openedx.svc.cluster.local:8000"
  # Local dev is plain http; the auth_backends default would send the LMS an
  # https:// callback that matches no registered redirect URI.
  SOCIAL_AUTH_REDIRECT_IS_HTTPS: "false"
  # LMS and Studio share the host `localhost` (cookies ignore the port), so
  # with the default name each login would overwrite the other's session.
  SESSION_COOKIE_NAME: "studio_sessionid"

  STATIC_ROOT_BASE: "/openedx/staticfiles"

  LOG_DIR: "/openedx/data/var/log/edx"
  LOGGING_ENV: "sandbox"
  LOCAL_LOGLEVEL: "INFO"

  DEBUG: "true"
  # JSON-encoded: the aqueduct ALLOWED_HOSTS field is list[Any], and
  # pydantic-settings parses list-typed env vars as JSON.
  ALLOWED_HOSTS: '["*"]'
  HTTPS: "off"

  OL_SETTINGS_DIR: ""

  SERVICE_VARIANT: "cms"

  # OpenTelemetry: console exporter, since there's no collector running in
  # local dev. See deployment-{lms,cms,worker,cms-worker}.yaml for the
  # opentelemetry-instrument wrap that actually activates this -- these
  # variables alone do nothing without it.
  OTEL_TRACES_EXPORTER: "console"
  # Metrics/logs aren't part of this rollout; leaving OTEL_METRICS_EXPORTER/
  # OTEL_LOGS_EXPORTER unset defaults to "otlp" (grpc), which isn't installed
  # here (only opentelemetry-exporter-otlp-proto-http is) and aborts the
  # *entire* SDK configuration, traces included -- not just metrics/logs.
  OTEL_METRICS_EXPORTER: "none"
  OTEL_LOGS_EXPORTER: "none"

---
# yaml-language-server: $schema=../../../../build_config.schema.json
# MIT Open Learning legacy MFE build customizations.
#
# Consumed by lehrer's generic OpenedxMfe.build_legacy_configured.  Pipelines
# call `dagger call mfe build-legacy-configured` with --deployment-name and
# --release-name; the mappings below are resolved into the explicit
# build_legacy arguments (extra_slot_files / styles_file / extra_npm_bundles).
#
# The $schema modeline validates this file in editors and agentic tools.
# Regenerate the schema with `dagger call mfe build-config-schema`.

# Per-deployment stylesheet override copied into the MFE root.
styles:
  mitx: mitx-styles.scss
  mitx-staging: mitx-styles.scss
  mitxonline: mitxonline-styles.scss

# Per-MFE customizations keyed by MFE application name.
mfes:
  admin-console: {}

  learning:
    extra_slot_files:
    - AIDrawerManagerSidebar.jsx
    - ResponsiveCourseTabs.jsx
    - FeedbackDrawerSlot.jsx
    - feedbackBundle.js
    # The AI-drawer coordinator ships in two variants; pick by release.
    - dest: SidebarAIDrawerCoordinator.jsx
      by_release:
        ulmo: SidebarAIDrawerCoordinator.ulmo.jsx
        default: SidebarAIDrawerCoordinator.jsx
    # master made SidebarContext module-private; the coordinator reads it
    # through this per-release hook.
    - dest: useSidebarContext.js
      by_release:
        verawood: useSidebarContext.verawood.js
        default: useSidebarContext.js
    # master stopped mirroring courseHomeMeta and units into the model store; these
    # read them from React Query there and from the model store on older releases.
    # ResponsiveCourseTabs is imported for every deployment, so ulmo needs a variant too.
    - dest: useCourseTabs.js
      by_release:
        ulmo: useCourseTabs.verawood.js
        verawood: useCourseTabs.verawood.js
        default: useCourseTabs.js
    - dest: useFeedbackEnrichment.js
      by_release:
        verawood: useFeedbackEnrichment.verawood.js
        default: useFeedbackEnrichment.js
    extra_npm_bundles:
    - "@mitodl/smoot-design@^6.38.1|public/static/smoot-design"

---
# MariaDB instance managed by the mariadb-operator.
# The operator creates Service "mysql" matching mysql.openedx.svc.cluster.local.
apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: mysql
  namespace: openedx
spec:
  # Read from openedx-secrets, which `lehrer dev setup` builds from the
  # environment. A separate Secret with the password written in here would
  # ignore a MYSQL_ROOT_PASSWORD override and leave the operator's root
  # account disagreeing with the value every other component is handed.
  #
  # Root is init-only: MariaDB sets its password when it initializes an empty
  # datadir and nothing rotates it afterwards, so an override has to be in the
  # environment before the *first* `lehrer dev setup`. Changing it later moves
  # the Secret and the operator's client without moving the server, which
  # surfaces as Grant/Database reconciliation failing on auth. `lehrer dev
  # setup` compares the stored value against the incoming one and says so.
  rootPasswordSecretKeyRef:
    name: openedx-secrets
    key: MYSQL_ROOT_PASSWORD
    generate: false

  # Initial application database and user.
  #
  # `database` does not create the schema itself — the operator turns it into a
  # Database CR named `<mariadb>-database` (so `mysql-database`, declared
  # below). It has to stay set regardless: IsInitialUserEnabled() requires
  # username, database *and* a password ref together, and dropping any one of
  # them means the edxapp user is never created at all.
  database: edxapp
  username: edxapp
  passwordSecretKeyRef:
    name: openedx-secrets
    key: MYSQL_PASSWORD

  storage:
    size: 5Gi
    storageClassName: local-path

  myCnf: |
    [mysqld]
    character-set-server = utf8mb4
    collation-server     = utf8mb4_unicode_ci
    sql_mode             = ''
    max_allowed_packet   = 128M

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
---
# edxapp database.
#
# The name is not cosmetic: the MariaDB reconciler looks for a Database at
# `<mariadb-name>-database` and only builds its own when that key is absent, so
# declaring `mysql-database` here means the operator adopts this spec instead.
#
# Without it the generated Database carries no characterSet/collate, the CRD
# defaults (utf8 / utf8_general_ci) get stamped on, and the operator issues
# `CREATE DATABASE edxapp CHARACTER SET = 'utf8' COLLATE = 'utf8_general_ci'` —
# an explicit clause, so the collation-server setting in myCnf above never gets
# a say. That leaves edxapp on 3-byte utf8 with a general_ci collation while
# notes and edxapp_csmh are on utf8mb4_unicode_ci.
#
# A schema's stored default collation is fixed at CREATE DATABASE time and does
# not follow later server-config changes. Any CREATE TABLE without an explicit
# COLLATE inherits that stale default, and an FK from such a table to one on the
# other collation fails with errno 150 ("Foreign key constraint is incorrectly
# formed"). Getting it right here is what keeps that failure class out of local
# dev; `lehrer dev db-collation` audits and repairs datadirs created before this.
apiVersion: k8s.mariadb.com/v1alpha1
kind: Database
metadata:
  name: mysql-database
  namespace: openedx
spec:
  name: edxapp
  mariaDbRef:
    name: mysql
  characterSet: utf8mb4
  collate: utf8mb4_unicode_ci
  # Skip, not the Delete default: the Database finalizer drops the schema,
  # so deleting this resource — to re-declare it, or by sweeping the
  # namespace — would take the developer's data with it.
  cleanupPolicy: Skip
---
# notes database for edx-notes-api
apiVersion: k8s.mariadb.com/v1alpha1
kind: Database
metadata:
  name: notes
  namespace: openedx
spec:
  mariaDbRef:
    name: mysql
  characterSet: utf8mb4
  collate: utf8mb4_unicode_ci
  cleanupPolicy: Skip
---
# edxapp_csmh database for courseware student module history
apiVersion: k8s.mariadb.com/v1alpha1
kind: Database
metadata:
  name: edxapp-csmh
  namespace: openedx
spec:
  name: edxapp_csmh
  mariaDbRef:
    name: mysql
  characterSet: utf8mb4
  collate: utf8mb4_unicode_ci
  cleanupPolicy: Skip
---
# Grant edxapp user access to all three databases
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: edxapp-grant-edxapp
  namespace: openedx
spec:
  mariaDbRef:
    name: mysql
  privileges:
  - "ALL PRIVILEGES"
  database: "edxapp"
  table: "*"
  username: edxapp
  grantOption: false
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: edxapp-grant-notes
  namespace: openedx
spec:
  mariaDbRef:
    name: mysql
  privileges:
  - "ALL PRIVILEGES"
  database: "notes"
  table: "*"
  username: edxapp
  grantOption: false
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: edxapp-grant-csmh
  namespace: openedx
spec:
  mariaDbRef:
    name: mysql
  privileges:
  - "ALL PRIVILEGES"
  database: "edxapp_csmh"
  table: "*"
  username: edxapp
  grantOption: false

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cms
  namespace: openedx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cms
  template:
    metadata:
      annotations:
        # Replaced by lehrer-core.star with a hash of the platform
        # ConfigMaps (ours plus any caller overrides). Changing it is
        # what rolls the pod, since envFrom alone never does.
        lehrer.mit.edu/config-checksum: "__PLATFORM_CONFIG_CHECKSUM__"
      labels:
        app: cms
    spec:
      containers:
      - name: cms
        image: lehrer-registry:5000/openedx-platform:dev
        command:
        - opentelemetry-instrument
        - gunicorn
        - "--workers=2"
        - "--name=cms"
        - "--bind=0.0.0.0:8010"
        - "--max-requests=1000"
        - "--timeout=300"
        - "cms.wsgi:application"
        ports:
        - containerPort: 8010
        env:
        - name: DJANGO_SETTINGS_MODULE
          value: "cms.envs.aqueduct"
        - name: OTEL_SERVICE_NAME
          value: "lehrer-dev-cms"
        envFrom:
        - configMapRef:
            name: cms-config
        - secretRef:
            name: openedx-secrets
        # Last wins: a caller composing this stack into its own cluster
        # supplies only the keys it needs to change (shared Valkey/
        # OpenSearch hosts, public URLs) instead of copying the whole
        # ConfigMap above and drifting from it.
        - configMapRef:
            name: cms-config-overrides
            optional: true
        readinessProbe:
          httpGet:
            path: /heartbeat
            port: 8010
          initialDelaySeconds: 60
          periodSeconds: 15
          failureThreshold: 10
        livenessProbe:
          httpGet:
            path: /heartbeat
            port: 8010
          initialDelaySeconds: 120
          periodSeconds: 30
          failureThreshold: 5
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2"
        volumeMounts:
        - name: edx-data
          mountPath: /openedx/data
      volumes:
      - name: edx-data
        emptyDir: {}

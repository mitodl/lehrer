---
# Imports the Open edX demo course so a fresh stack has something to browse:
# the demo_course step of local-dev/provision/bootstrap.yaml, which picks the
# course branch matching the platform's release.
#
# Kept out of edxapp-provision and wired as a manual Tilt trigger
# (lehrer-core.star) because it clones ~70MB over the network, which is not
# something every `tilt up` should pay for.
# Trigger it from the Tilt UI, or with `tilt trigger edxapp-demo-course`.
#
# Re-running overwrites the existing course in place.
apiVersion: batch/v1
kind: Job
metadata:
  name: edxapp-demo-course
  namespace: openedx
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: edxapp-demo-course
    spec:
      restartPolicy: Never
      containers:
      - name: import
        # Image tag is managed by Tilt via custom_build (same ref as the
        # platform deployments).
        image: openedx-platform
        command:
        - python
        - -m
        - lehrer_bootstrap
        - /openedx/bootstrap/bootstrap.yaml
        - --steps
        - demo_course
        env:
        - name: DJANGO_SETTINGS_MODULE
          value: "cms.envs.aqueduct"
        envFrom:
        - configMapRef:
            name: cms-config
        - secretRef:
            name: openedx-secrets
        # Last wins: a caller composing this stack into its own cluster
        # supplies only the keys it needs to change (shared Valkey/
        # OpenSearch hosts, public URLs) instead of copying the whole
        # ConfigMap above and drifting from it.
        - configMapRef:
            name: cms-config-overrides
            optional: true
        volumeMounts:
        - name: bootstrap
          mountPath: /openedx/bootstrap
        resources:
          requests:
            memory: "1Gi"
            cpu: "250m"
          limits:
            memory: "3Gi"
      volumes:
      - name: bootstrap
        configMap:
          name: edxapp-bootstrap

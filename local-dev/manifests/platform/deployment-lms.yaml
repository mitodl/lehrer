---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lms
  namespace: openedx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lms
  template:
    metadata:
      annotations:
        # Replaced by lehrer-core.star with a hash of the platform
        # ConfigMaps (ours plus any caller overrides). Changing it is
        # what rolls the pod, since envFrom alone never does.
        lehrer.mit.edu/config-checksum: "__PLATFORM_CONFIG_CHECKSUM__"
      labels:
        app: lms
    spec:
      containers:
      - name: lms
        # Bare name: Tilt matches it to the custom_build in lehrer-core.star
        # and substitutes the built ref, registry included.
        image: openedx-platform
        # Granian, not gunicorn, because gunicorn serves no static files and
        # aqueduct runs with DEBUG=False, so Django will not either: every
        # /static/... URL the LMS emits 404s and the pages render unstyled and
        # scriptless. The assets are in the image at /openedx/staticfiles (the
        # build runs collectstatic); nothing was serving them.
        #
        # --static-path-mount is Granian's own static handler, so this needs no
        # nginx sidecar and no extra package -- granian is already installed by
        # build_manifest.yaml. Its default static route is /static, which is
        # exactly the LMS's STATIC_URL, so no --static-path-route is needed.
        # Matches production, where edxapp passes the same mount
        # (ol-infrastructure applications/edxapp/k8s_resources.py).
        #
        # gunicorn's --max-requests and --timeout are dropped rather than
        # translated: Granian has no per-request timeout and no recycle-by-
        # request-count. --respawn-failed-workers and --backlog mirror what
        # production sets alongside the mount.
        command:
        - opentelemetry-instrument
        - granian
        - --interface
        - wsgi
        - --host
        - 0.0.0.0
        - --port
        - "8000"
        - --workers
        - "2"
        - --respawn-failed-workers
        - --backlog
        - "128"
        - --static-path-mount
        - /openedx/staticfiles
        - "lms.wsgi:application"
        ports:
        - containerPort: 8000
        env:
        - name: DJANGO_SETTINGS_MODULE
          value: "lms.envs.aqueduct"
        - name: OTEL_SERVICE_NAME
          value: "lehrer-dev-lms"
        envFrom:
        - configMapRef:
            name: lms-config
        - secretRef:
            name: openedx-secrets
        # Last wins: a caller composing this stack into its own cluster
        # supplies only the keys it needs to change (shared Valkey/
        # OpenSearch hosts, public URLs) instead of copying the whole
        # ConfigMap above and drifting from it.
        - configMapRef:
            name: lms-config-overrides
            optional: true
        readinessProbe:
          httpGet:
            path: /heartbeat
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 15
          failureThreshold: 10
        livenessProbe:
          httpGet:
            path: /heartbeat
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 30
          failureThreshold: 5
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2"
        volumeMounts:
        - name: edx-data
          mountPath: /openedx/data
      volumes:
      - name: edx-data
        emptyDir: {}

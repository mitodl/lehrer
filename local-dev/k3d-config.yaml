---
apiVersion: k3d.io/v1alpha5
kind: Simple

metadata:
  name: lehrer-dev

# Local container registry — accessible as k3d-lehrer-registry:5000 from within
# the cluster (K3d auto-configures the CoreDNS alias), and as localhost:5100 from
# the host. All custom_build commands push to localhost:5100; all K8s manifests
# reference k3d-lehrer-registry:5000.
registries:
  create:
    name: lehrer-registry
    host: "0.0.0.0"
    hostPort: "5100"

# Bind Traefik ingress ports to localhost for browser access. Every port lands
# on Traefik's one entrypoint, so the port does not pick the service: the
# Ingress in lehrer-core.star routes by host (lms.localhost, studio.localhost,
# notes.localhost, <site>.localhost). Tilt must not port-forward any of these
# host ports, or the forward fails with "address already in use".
ports:
- port: 8000:80
  nodeFilters: ["loadbalancer"]
- port: 8010:80
  nodeFilters: ["loadbalancer"]
# MFE ingress for the *compiled* MFEs. 8090 rather than the conventional 8080
# to avoid clashing with other local dev servers that commonly squat on 8080.
# `lehrer dev setup` preflights this port. lehrer-core.star routes each compiled
# site here by host, as <site>.localhost, so a build config that gives its MFE a
# host of its own must name that address to be reachable in local dev. A
# deployment that serves MFEs as a sub-path of the LMS instead (mit-ol) carries
# the LMS origin and is reached through the LMS ingress, not this one.
#
# site.config.dev.tsx is a separate matter: under `--mfe-hot-reload` the
# compiled MFEs are not deployed at all, and each site's dev server binds its
# own port from mfe_slot_config/frontend/dev-ports.yaml. Those must *not* be
# 8090 — the loadbalancer holds it for as long as the cluster is up.
- port: 8090:80
  nodeFilters: ["loadbalancer"]
- port: 8001:80
  nodeFilters: ["loadbalancer"]

servers: 1
agents: 1

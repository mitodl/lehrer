---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cms-worker
  namespace: openedx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cms-worker
  template:
    metadata:
      annotations:
        # Replaced by lehrer-core.star with a hash of the platform
        # ConfigMaps (ours plus any caller overrides). Changing it is
        # what rolls the pod, since envFrom alone never does.
        lehrer.mit.edu/config-checksum: "__PLATFORM_CONFIG_CHECKSUM__"
      labels:
        app: cms-worker
    spec:
      containers:
      - name: worker
        image: openedx-platform
        command:
        - opentelemetry-instrument
        - celery
        - "--app=cms.celery"
        - worker
        - "--loglevel=info"
        - "--hostname=edx.cms.%%h"
        - "--concurrency=4"
        env:
        - name: DJANGO_SETTINGS_MODULE
          value: "cms.envs.aqueduct"
        - name: OTEL_SERVICE_NAME
          value: "lehrer-dev-cms-worker"
        envFrom:
        - configMapRef:
            name: cms-config
        - secretRef:
            name: openedx-secrets
        # Last wins: a caller composing this stack into its own cluster
        # supplies only the keys it needs to change (shared Valkey/
        # OpenSearch hosts, public URLs) instead of copying the whole
        # ConfigMap above and drifting from it.
        - configMapRef:
            name: cms-config-overrides
            optional: true
        livenessProbe:
          exec:
            command:
            - celery
            - "--app=cms.celery"
            - inspect
            - ping
            - "--timeout=5"
          initialDelaySeconds: 60
          periodSeconds: 60
          # The probe starts a whole celery CLI, which loads the Django settings
          # before it sends the 5s ping. That alone takes about 10s here, so a
          # 10s timeout kills a healthy worker that has just answered pong.
          timeoutSeconds: 30
          failureThreshold: 5
        resources:
          requests:
            memory: "1Gi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1"
        volumeMounts:
        - name: edx-data
          mountPath: /openedx/data
      volumes:
      - name: edx-data
        emptyDir: {}

---
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
    args: [--allow-multiple-documents]
  - id: check-added-large-files
    args: [--maxkb=1024]
  - id: check-merge-conflict
  - id: check-toml
  - id: debug-statements
- repo: https://github.com/jumanjihouse/pre-commit-hook-yamlfmt
  rev: 0.2.3
  hooks:
  - id: yamlfmt
    args:
    - --mapping
    - "2"
    - --sequence
    - "2"
    - --offset
    - "0"
    - --width
    - "80"
    - --preserve-quotes
- repo: https://github.com/adrienverge/yamllint.git
  rev: v1.38.0
  hooks:
  - id: yamllint
    args: [--format, parsable, -d, relaxed]
- repo: https://github.com/Yelp/detect-secrets
  rev: v1.5.0
  hooks:
  - id: detect-secrets
    args:
    - --exclude-lines
    - "(^encryptedkey:|^secure:|^secretsprovider:)"
    - --exclude-files
    - deployments/mit-ol/settings/.*/models/aqueduct\.py
    - --exclude-files
    - deployments/mit-ol/settings/models/base\.py
- repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
  rev: "v0.16.10"
  hooks:
  - id: ruff-format
  - id: ruff-check
    args: [--extend-ignore=D1, --fix]
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v2.4.0
  hooks:
  - id: mypy
    exclude: ^deployments/
    args:
    - --config-file=pyproject.toml
    - --warn-unused-configs
    additional_dependencies:
    - cyclopts>=3
    - dagger-io
    - pydantic>2.10
    - pydantic-settings[yaml]
    - pytest>=8
    - pyyaml
    - types-PyYAML
    - types-requests
- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: v0.11.0.1
  hooks:
  - id: shellcheck
- repo: https://github.com/rhysd/actionlint
  rev: v1.7.12
  hooks:
  - id: actionlint
    name: actionlint
    description: Runs actionlint to lint GitHub Actions workflow files
- repo: local
  hooks:
  - id: lehrer-core-boundary
    name: lehrer core boundary — no OL-specific strings
    language: pygrep
    # `deployments` is matched only where it is a path or an import, not where
    # it is the English word -- this module's docstring says "Kubernetes
    # deployments" and "the deployments that pin", neither of which is a
    # boundary violation. A bare `deployments` alternative would flag those, so
    # the three forms that *are* violations are spelled out instead of dropping
    # the guard: a path segment, a quoted literal (`Path("deployments")`), and
    # an attribute/module reference (`deployments.generic`), the last anchored
    # on a following lowercase char so a sentence ending in "deployments." does
    # not match. `mit-ol` is listed separately because `mitol` does not cover
    # the hyphenated spelling.
    entry: 'deployments/|["'']deployments["'']|\bdeployments\.[a-z_]|mit-ol|mitol|mitxonline|mitodl|github\.mit\.edu|verificient|proctortrack'
    files: ^src/lehrer/(core|infra|settings)/
    exclude: ^src/lehrer/(core|infra)/__init__\.py$
  - id: lehrer-generic-provision-boundary
    name: generic provisioning — no OL-specific names
    language: pygrep
    # The generic deployment's bootstrap spec is the one file every consumer
    # gets regardless of operator, so an OL-specific row belongs in
    # deployments/mit-ol/provision/ instead. The `deployments` alternatives the
    # hook above carries are dropped here: this path is itself under
    # deployments/, so they would match every self-reference.
    #
    # The two namespace prefixes matter more than the spelled-out names: a
    # provisioning row names backends, slugs and env vars, not prose, so
    # `ol-oauth2` and `OL_OAUTH2_CLIENT_ID` are what an OL row actually looks
    # like. `\bol[-_]` catches those without matching a word that merely ends
    # in "ol" (protocol-, symbol_), and `\bmit\b` catches "MIT Open Learning"
    # and `mit-ol` without matching "submit" or "permit".
    entry: '(?i)\bol[-_]|\bmit\b|mitol|mitxonline|mitodl|verificient|proctortrack'
    files: ^deployments/generic/provision/
  - id: build-config-schema
    name: regenerate build_config JSON schema from the Pydantic models
    language: system
    entry: "bash -c 'uv run python -c \"import json; from lehrer.core.mfe_config import\
      \ json_schema; print(json.dumps(json_schema(), indent=2))\" > build_config.schema.json'"
    files: ^(src/lehrer/core/mfe_config\.py|build_config\.schema\.json)$
    pass_filenames: false
  - id: build-manifest-schema
    name: regenerate build_manifest JSON schema from the Pydantic models
    language: system
    entry: "bash -c 'uv run python -c \"import json; from lehrer.core.build_manifest\
      \ import json_schema; print(json.dumps(json_schema(), indent=2))\" > build_manifest.schema.json'"
    files: ^(src/lehrer/core/build_manifest\.py|build_manifest\.schema\.json)$
    pass_filenames: false
  - id: bootstrap-schema
    name: regenerate bootstrap JSON schema from the Pydantic models
    language: system
    entry: "bash -c 'uv run python -c \"import json; from lehrer.bootstrap.spec import\
      \ json_schema; print(json.dumps(json_schema(), indent=2))\" > bootstrap.schema.json'"
    files: ^(src/lehrer/bootstrap/spec\.py|bootstrap\.schema\.json)$
    pass_filenames: false
- repo: https://github.com/hadolint/hadolint
  rev: v2.15.1
  hooks:
  - id: hadolint-docker
- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: v1.30.1
  hooks:
  - id: zizmor
    args: [--no-progress, --min-severity=medium, --min-confidence=medium]

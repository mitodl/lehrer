---
# Creates the edx-notes-api schema and its OpenSearch index.
#
# The MariaDB CR creates the `notes` database and grants edxapp on it, but
# nothing creates the tables, so every annotator request 500s on
# `Table 'notes.v1_note' doesn't exist` even once LMS<->notes OAuth is wired
# up. `search_index --rebuild -f` is the notes Makefile's create-index target.
apiVersion: batch/v1
kind: Job
metadata:
  name: notes-migrate
  namespace: openedx
spec:
  # MariaDB DDL is not transactional. A migration that dies partway leaves the
  # tables and columns it already created behind, so a blind Job-level retry
  # runs the same migration again against a schema it has half-built and fails
  # on "table already exists" / "duplicate column" — which buries whatever the
  # first, real error was. Fail on the first attempt and surface it instead.
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: notes-migrate
    spec:
      restartPolicy: Never
      initContainers:
      # The MariaDB operator creates the `edxapp` User and its Grants *after*
      # the MariaDB CR reports Ready, and the User CR it generates is not in
      # this repo's manifests, so there is nothing for Tilt's resource_deps to
      # gate on -- waiting for the MariaDB resource is demonstrably not enough.
      # A cold `tilt up` therefore races the credential into existence and this
      # Job dies on `1045 Access denied for user 'edxapp'` (authentication, not
      # the missing-grant 1044). backoffLimit is deliberately 0 above, so there
      # is no retry to absorb it; wait for the credential to work first.
      #
      # Reuses the notes image so the check runs through the same MySQLdb driver
      # and credentials as the migration that follows, without adding a mysql
      # client image. Connects directly rather than via django.setup(): notes'
      # env_config.py reads os.environ["OAUTH_CLIENT_ID"] at import, which is
      # one of the two names the Job container has to remap from NOTES_* below,
      # so a Django-based probe would KeyError on every iteration and this loop
      # would never exit.
      - name: wait-for-mysql-auth
        image: openedx-notes
        command:
        - sh
        - -c
        - |
          until python -c "
          import os
          import MySQLdb
          MySQLdb.connect(
              host=os.environ['DB_HOST'],
              port=int(os.environ.get('DB_PORT', '3306')),
              user=os.environ['DB_USER'],
              passwd=os.environ['DB_PASSWORD'],
              db=os.environ['DB_NAME'],
          ).close()
          " 2>/dev/null; do
            echo "waiting for mysql to accept ${DB_USER}@${DB_HOST}/${DB_NAME}"
            sleep 3
          done
          echo "==> mysql accepted ${DB_USER}; proceeding to migrations"
        envFrom:
        - configMapRef:
            name: notes-config
        - secretRef:
            name: openedx-secrets
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
      containers:
      - name: migrate
        # Image tag is managed by Tilt via custom_build (same ref as the notes
        # Deployment). The image entrypoint is gunicorn, so `command`
        # overrides it.
        image: openedx-notes
        command:
        - sh
        - -c
        - |
          set -e
          echo "==> notes migrations"
          python manage.py migrate --noinput

          # `search_index --rebuild -f` (the notes Makefile's create-index
          # target) deletes the index first, which would throw away every
          # annotation each time Tilt re-runs this Job on an image change, so
          # use the non-destructive --create.
          #
          # The index is not optional. notesserver/settings/common.py sets
          # ELASTICSEARCH_DSL_SIGNAL_PROCESSOR to RealTimeSignalProcessor and
          # env_config.py does not override it, so every Note save
          # synchronously writes to the index — without one, creating an
          # annotation 500s, not just searching. Failing here keeps the notes
          # Deployment down rather than bringing up a service that looks
          # healthy and cannot be written to. An already-existing index is the
          # one tolerated outcome, since this Job re-runs on image changes.
          echo "==> notes search index"
          if python manage.py search_index --create > /tmp/index.log 2>&1; then
            cat /tmp/index.log
          else
            cat /tmp/index.log
            grep -q resource_already_exists_exception /tmp/index.log || {
              echo "==> Could not create the notes search index." \
                   "Annotation writes would fail, so this Job fails instead." \
                   "A full disk trips OpenSearch's high-watermark" \
                   "create-index block and is the likeliest cause."
              exit 1
            }
            echo "==> search index already exists; left in place"
          fi
        envFrom:
        - configMapRef:
            name: notes-config
        - secretRef:
            name: openedx-secrets
        env:
        # env_config.py reads the OAuth pair under unprefixed names; the
        # Secret stores them under NOTES_*.
        - name: OAUTH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: openedx-secrets
              key: NOTES_OAUTH_CLIENT_ID
        - name: OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: openedx-secrets
              key: NOTES_OAUTH_CLIENT_SECRET
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cms-config
  namespace: openedx
data:
  MYSQL_HOST: "mysql.openedx.svc.cluster.local"
  MYSQL_PORT: "3306"
  MYSQL_DB_NAME: "edxapp"
  MYSQL_USER: "edxapp"

  CELERY_BROKER_TRANSPORT: "redis"
  CELERY_BROKER_HOSTNAME: "redis-valkey.openedx.svc.cluster.local"
  # Django caches (and the cache-backed sessions) on the broker's Valkey, in
  # DB 1 so they stay out of the broker's DB 0. The host follows
  # CELERY_BROKER_HOSTNAME, so a caller that repoints the broker moves the
  # caches too. Without it every cache alias points at a memcached nobody
  # runs and no login can hold a session.
  CACHE_REDIS_DB: "1"
  CELERY_BROKER_USER: ""
  CELERY_BROKER_PASSWORD: ""
  CELERY_BROKER_VHOST: ""

  MONGODB_HOST: "mongodb-svc.openedx.svc.cluster.local"
  MONGODB_PORT: "27017"
  MONGODB_USER: "edxapp"
  MONGODB_DB: "edxapp"
  MONGODB_REPLICASET: "mongodb"
  MONGODB_AUTH_SOURCE: "admin"

  ELASTIC_SEARCH_HOST: "opensearch-cluster-master.openedx.svc.cluster.local"
  ELASTIC_SEARCH_PORT: "9200"

  LMS_BASE_URL: "http://localhost:8000"
  CMS_BASE_URL: "http://localhost:8010"
  LMS_BASE: "localhost:8000"
  CMS_BASE: "localhost:8010"

  # Studio login goes through the LMS's OAuth2 provider. The browser is sent to
  # authorize at LMS_BASE_URL (SOCIAL_AUTH_EDX_OAUTH2_PUBLIC_URL_ROOT defaults
  # to it), but the token exchange runs from this pod, which cannot reach the
  # LMS through the host's localhost. The key and secret come from
  # openedx-secrets and match the cms-sso application edxapp-provision creates.
  SOCIAL_AUTH_EDX_OAUTH2_URL_ROOT: "http://lms.openedx.svc.cluster.local:8000"
  # Local dev is plain http; the auth_backends default would send the LMS an
  # https:// callback that matches no registered redirect URI.
  SOCIAL_AUTH_REDIRECT_IS_HTTPS: "false"
  # LMS and Studio share the host `localhost` (cookies ignore the port), so
  # with the default name each login would overwrite the other's session.
  SESSION_COOKIE_NAME: "studio_sessionid"

  STATIC_ROOT_BASE: "/openedx/staticfiles"

  LOG_DIR: "/openedx/data/var/log/edx"
  LOGGING_ENV: "sandbox"
  LOCAL_LOGLEVEL: "INFO"

  DEBUG: "true"
  # JSON-encoded: the aqueduct ALLOWED_HOSTS field is list[Any], and
  # pydantic-settings parses list-typed env vars as JSON.
  ALLOWED_HOSTS: '["*"]'
  HTTPS: "off"

  OL_SETTINGS_DIR: ""

  SERVICE_VARIANT: "cms"

  # OpenTelemetry: console exporter, since there's no collector running in
  # local dev. See deployment-{lms,cms,worker,cms-worker}.yaml for the
  # opentelemetry-instrument wrap that actually activates this -- these
  # variables alone do nothing without it.
  OTEL_TRACES_EXPORTER: "console"
  # Metrics/logs aren't part of this rollout; leaving OTEL_METRICS_EXPORTER/
  # OTEL_LOGS_EXPORTER unset defaults to "otlp" (grpc), which isn't installed
  # here (only opentelemetry-exporter-otlp-proto-http is) and aborts the
  # *entire* SDK configuration, traces included -- not just metrics/logs.
  OTEL_METRICS_EXPORTER: "none"
  OTEL_LOGS_EXPORTER: "none"

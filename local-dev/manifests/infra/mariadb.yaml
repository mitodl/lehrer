---
# MariaDB instance managed by the mariadb-operator.
# The operator creates Service "mysql" matching mysql.openedx.svc.cluster.local.
apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: mysql
  namespace: openedx
spec:
  # Read from openedx-secrets, which `lehrer dev setup` builds from the
  # environment. A separate Secret with the password written in here would
  # ignore a MYSQL_ROOT_PASSWORD override and leave the operator's root
  # account disagreeing with the value every other component is handed.
  rootPasswordSecretKeyRef:
    name: openedx-secrets
    key: MYSQL_ROOT_PASSWORD
    generate: false

  # Initial application database and user
  database: edxapp
  username: edxapp
  passwordSecretKeyRef:
    name: openedx-secrets
    key: MYSQL_PASSWORD

  storage:
    size: 5Gi
    storageClassName: local-path

  myCnf: |
    [mysqld]
    character-set-server = utf8mb4
    collation-server     = utf8mb4_unicode_ci
    sql_mode             = ''
    max_allowed_packet   = 128M

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
---
# notes database for edx-notes-api
apiVersion: k8s.mariadb.com/v1alpha1
kind: Database
metadata:
  name: notes
  namespace: openedx
spec:
  mariaDbRef:
    name: mysql
  characterSet: utf8mb4
  collate: utf8mb4_unicode_ci
---
# edxapp_csmh database for courseware student module history
apiVersion: k8s.mariadb.com/v1alpha1
kind: Database
metadata:
  name: edxapp-csmh
  namespace: openedx
spec:
  name: edxapp_csmh
  mariaDbRef:
    name: mysql
  characterSet: utf8mb4
  collate: utf8mb4_unicode_ci
---
# Grant edxapp user access to all three databases
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: edxapp-grant-edxapp
  namespace: openedx
spec:
  mariaDbRef:
    name: mysql
  privileges:
  - "ALL PRIVILEGES"
  database: "edxapp"
  table: "*"
  username: edxapp
  grantOption: false
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: edxapp-grant-notes
  namespace: openedx
spec:
  mariaDbRef:
    name: mysql
  privileges:
  - "ALL PRIVILEGES"
  database: "notes"
  table: "*"
  username: edxapp
  grantOption: false
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: edxapp-grant-csmh
  namespace: openedx
spec:
  mariaDbRef:
    name: mysql
  privileges:
  - "ALL PRIVILEGES"
  database: "edxapp_csmh"
  table: "*"
  username: edxapp
  grantOption: false

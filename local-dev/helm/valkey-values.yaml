---
# valkey/valkey — Valkey (Redis-compatible) broker for local dev.
#
# This is the valkey.io chart, not Bitnami's. Its schema has no `architecture`
# or top-level `persistence` key, and no `master:` section — those are Bitnami
# names, and unknown keys are silently ignored rather than rejected, so values
# written against the wrong schema look applied but do nothing.
#
# Standalone is the default (`replica.enabled: false`), and in that mode the
# chart renders a Deployment whose /data comes from `dataStorage` — a PVC when
# enabled, an emptyDir when not.
#
# The rendered Service is named `<release>-valkey`. lehrer-core.star installs
# this under the release name "redis", so the in-cluster host is
# `redis-valkey.openedx.svc.cluster.local` — which is what
# CELERY_BROKER_HOSTNAME in the platform configmaps points at.

auth:
  enabled: false

dataStorage:
  # Matches the chart default, set explicitly so the ephemeral broker reads as
  # a decision rather than an oversight: local dev gains nothing from a Celery
  # queue that survives a restart, and the predecessor to this file asked for a
  # PVC under Bitnami key names that this chart ignored, so no environment has
  # ever actually had one.
  enabled: false

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "500m"

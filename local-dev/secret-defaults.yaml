---
# Canonical local-dev secret defaults for the openedx-secrets Secret.
#
# Read by two consumers, which is the whole point of the file existing:
#   - `lehrer dev setup` (src/lehrer/cli/local_dev.py), for lehrer's own cluster
#   - setup()'s manage_secrets in local-dev/lehrer-core.star, for a Tilt caller
#     composing this stack into a cluster it already owns (ol-infrastructure's
#     local-dev is the first such caller)
#
# Before this file, each consumer carried its own copy and they drifted. A key
# added here reaches both; a key added to only one of them reaches neither
# reliably.
#
# Every value is a local-dev default and safe to commit. Each is overridable by
# an environment variable of the same name at the time the Secret is created.
# None of these may be used outside local development.
secrets:
- key: MYSQL_ROOT_PASSWORD
  default: openedx-dev    # pragma: allowlist secret
    # MariaDB sets root's password only when it initializes an empty datadir.
    # Changing this against an already-initialized cluster leaves the server on
    # the old value with no admission error — see _warn_on_init_only_root_password.
- key: MYSQL_PASSWORD
  default: openedx-dev    # pragma: allowlist secret
- key: DJANGO_SECRET_KEY
  default: insecure-local-dev-key-change-for-staging    # pragma: allowlist secret
- key: MONGO_PASSWORD
  default: openedx-dev    # pragma: allowlist secret
- key: NOTES_OAUTH_CLIENT_ID
  default: notes
- key: NOTES_OAUTH_CLIENT_SECRET
  default: notes-dev-secret    # pragma: allowlist secret
- key: SOCIAL_AUTH_EDX_OAUTH2_KEY
    # Studio's SSO client against the LMS. Named for the setting the CMS reads
    # it as; edxapp-provision registers the cms-sso application with the same
    # pair.
  default: cms-sso
- key: SOCIAL_AUTH_EDX_OAUTH2_SECRET
  default: cms-sso-dev-secret    # pragma: allowlist secret
- key: JWT_PRIVATE_SIGNING_JWK
    # The LMS signs every JWT it issues (login cookies, OAuth2 access tokens,
    # so Studio SSO too) with this RSA key, and everything that verifies one
    # reads JWT_PUBLIC_SIGNING_JWK_SET. Generated once with edx-platform's
    # `manage.py lms generate_jwt_signing_key --key-id lehrer-local-dev` and
    # committed like the other local-dev defaults: it signs nothing outside a
    # developer's own cluster. The pair has to match; regenerate both
    # together.
  default: '{"kty":"RSA","key_ops":["sign"],"n":"6Z_arTUoEA6Fxi8nZaj6Gl5gWjwAJNAd4tsNt78Txy0MPRL-FqROlsGN8OGsZuYkggPDON7GM8P2-Aqaal8m5nWGCPPWu3eQMJl-uRLZDdPm5uEv5tycHTMahz9Oznu7YYJ_Q3kV-3TuOYNYpCpiFL6NKZRGvCrMu0kDcp5qSKJopUqhnVSOM2TdlRgN8ikc_QkJHJPOdm51SDg0GmGfvJIe5Jk9QUKqCXL5WwJ_IKBWPyOoz8VBJeLkRTeRT9fI-8wumapKvLN8bszMhvaPQRRFxcqduLmNXUbzjdKa2xiGkURYMYR_zQTpn9SOHcYtmeYJ_nGI_8ZOi0wA9frPxQ","e":"AQAB","d":"CbsS4I0EWd4PYo8ho0Fz08S9KA6aUofPZUM94bqvm04VvB0Xs5_s9nWIZBFnEDNWYoq_YMjsO3xWXV15S6RVjY4ByUsSu7Gbfvkdujd-DlSwDn5jQHvm2rmyr97XEvc8LK_cfVYRSgbd5BjDu-hYa0gs8myB7iHgPI33FH9jRBqMEDzKAf5e127uTQZXqyZWoCT0B2JjZg1dRTOTZyPGzfN7SlT9Gzh-ZX2txc-GrfYFAlrIfkk9_DOi00pJC31kYVtynOP9ogYI1K7ATqaCALKI6j7z2cp0aM46irLksS7lHwmr-EUE4EY8KFjN9U_aDFtT81SCkuyu_150LdaOkQ","p":"7hJRauhTXXuyPEBRVMVpOh9qm8skPIoB-s3GTeMylusbN9Ga0q3BL7qTst8VlF5uDVM7KV5uvEolqz2_x5ODDTh_lcqzG-zQ2K5ArB3bCQgpK0qvHcTRipiJKmZvIMhPYKcOFsnhOE-_R1AKlvGaAiQb6gNNpF_IwXZL0lAah20","q":"-zfNSnDOu0z3OFOGXrPv-J2avAbeAFcPB956qIE31idon_w5p9M7QFUvpD15r8BbvWSu03dKNTt4lvXAU3fPPGHFfHt6uvg-R41hhZfWmRm0LGeYHCA35TPQibdhSH4OYOH4E5Z-MW6hpEhnAUfk140uan7mYVp2q4dMggM5erk","dp":"zRZYrxku38R0mbTqm3Vondp8k3NfZwuYgv-LioNjjGFC1EYr8rweRUicfiXxyBvFAJOnzo58JJZXdvo94Oaxqcz3FApHW5IZo-AQ9HTPwSsXlCTFUIbB4HxhBXay2vHUd7XRzE3jSAhjBkLsrHW7L4b9yQ1JcIXXQtnunWHGSM0","dq":"9pF6iQnXnraYH0y7oc_yRI5MBSioVKUeN5cBxMmvSB497mjdHf-RND9oF0fPW9TtNiLQBPYce8r3PRPPxRze5mEAOIHpoAFu_0Og6EJzeqlj0gGLpm9o7SnCEKlQbppq-mRP3Mnk6hevx1LY5sTtszL6z8Pl0r-7ofeV_DW2AOE","qi":"B6-HsSVTdvqsVMay7vx9ezIGJRhbYspH-AWLVq86OEgcpVyJpRXjjZELyOYEA7vjLh66jyHihtA4ZZP7tMdG4bJuD4mUijzZK-TJnTsI05KewFDR0h0f8oqVv_XRxoXzKg6ev_piBwmlDMd7wt7w8Ca2hc5vgTpopF40LuX2dyg","kid":"lehrer-local-dev"}'    # pragma: allowlist secret
- key: JWT_PUBLIC_SIGNING_JWK_SET
  default: '{"keys":[{"kty":"RSA","key_ops":["verify"],"n":"6Z_arTUoEA6Fxi8nZaj6Gl5gWjwAJNAd4tsNt78Txy0MPRL-FqROlsGN8OGsZuYkggPDON7GM8P2-Aqaal8m5nWGCPPWu3eQMJl-uRLZDdPm5uEv5tycHTMahz9Oznu7YYJ_Q3kV-3TuOYNYpCpiFL6NKZRGvCrMu0kDcp5qSKJopUqhnVSOM2TdlRgN8ikc_QkJHJPOdm51SDg0GmGfvJIe5Jk9QUKqCXL5WwJ_IKBWPyOoz8VBJeLkRTeRT9fI-8wumapKvLN8bszMhvaPQRRFxcqduLmNXUbzjdKa2xiGkURYMYR_zQTpn9SOHcYtmeYJ_nGI_8ZOi0wA9frPxQ","e":"AQAB","kid":"lehrer-local-dev"}]}'    # pragma: allowlist secret
- key: PROVISION_SUPERUSER_PASSWORD
    # Consumed by the edxapp-provision Job; the username and email it pairs
    # with live in job-provision.yaml, since neither is secret.
  default: edx    # pragma: allowlist secret

# Keys whose value is copied from another key rather than defaulted or read
# from the environment on their own. DB_PASSWORD has mirrored MYSQL_PASSWORD
# since the setup.sh this CLI replaced.
mirrors:
- key: DB_PASSWORD
  from: MYSQL_PASSWORD

---
# Runs Django migrations for the LMS and CMS against the shared edxapp MySQL
# database before the platform deployments start serving. The edxapp database
# and user are created by the MariaDB CR, but nothing creates the schema — so
# without this Job /heartbeat returns 500 (no tables).
#
# What it migrates, and in what order, is the migrate step of
# local-dev/provision/bootstrap.yaml; lehrer_bootstrap runs it.
apiVersion: batch/v1
kind: Job
metadata:
  name: edxapp-migrate
  namespace: openedx
spec:
  # MariaDB DDL is not transactional. A migration that dies partway leaves the
  # tables and columns it already created behind, so a blind Job-level retry
  # runs the same migration again against a schema it has half-built and fails
  # on "table already exists" / "duplicate column" — which buries whatever the
  # first, real error was. Fail on the first attempt and surface it instead.
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: edxapp-migrate
    spec:
      restartPolicy: Never
      containers:
      - name: migrate
        # Image tag is managed by Tilt via custom_build (same ref as the
        # platform deployments).
        image: openedx-platform
        command:
        - python
        - -m
        - lehrer_bootstrap
        - /openedx/bootstrap/bootstrap.yaml
        - --steps
        - migrate
        env:
        # The runner calls django.setup() directly rather than going through
        # manage.py, so the settings module has to come from the environment.
        # It runs each migrate under the matching service's module
        # (cms.envs.aqueduct for the CMS).
        - name: DJANGO_SETTINGS_MODULE
          value: "lms.envs.aqueduct"
        envFrom:
        - configMapRef:
            name: lms-config
        - secretRef:
            name: openedx-secrets
        # Last wins: a caller composing this stack into its own cluster
        # supplies only the keys it needs to change (shared Valkey/
        # OpenSearch hosts, public URLs) instead of copying the whole
        # ConfigMap above and drifting from it.
        - configMapRef:
            name: lms-config-overrides
            optional: true
        volumeMounts:
        - name: bootstrap
          mountPath: /openedx/bootstrap
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
      volumes:
      - name: bootstrap
        configMap:
          name: edxapp-bootstrap

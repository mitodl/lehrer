---
name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true
    - run: uv sync --all-groups
    - run: uv run ruff check .
    - run: uv run ruff format --check .
    - run: uv run mypy --config-file=pyproject.toml src/lehrer tests
    - run: uv run pytest tests/ -v
    - run: uv run pre-commit run build-config-schema --all-files
    - run: uv run pre-commit run build-manifest-schema --all-files
    - run: uv run pre-commit run lehrer-core-boundary --all-files
